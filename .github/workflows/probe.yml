name: probe
on:
  push:
    paths: ["scripts/probe.sh", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p data && bash scripts/probe.sh > data/probe.txt 2>&1
      - run: |
          git config user.name "upslope-bot"
          git config user.email "upslope-bot@users.noreply.github.com"
          git add data/probe.txt
          git commit -m "Probe results [skip ci]" || exit 0
          git push

name: verify
on:
  schedule:
    # Once a day, before the 6am Eastern forecast run.
    - cron: "40 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/verify.mjs", "scripts/stations.json", ".github/workflows/verify.yml"]
permissions:
  contents: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/verify.mjs
      - name: Commit scores
        run: |
          git config user.name "upslope-bot"
          git config user.email "upslope-bot@users.noreply.github.com"
          git add data/skill.json data/obs.json data/verify-log.txt
          git commit -m "Model scores $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
